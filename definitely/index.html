<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definitely | Coming Soon</title>
    <meta name="theme-color" content="#05070d">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="definitely-icon.png">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(124, 240, 201, 0.08), transparent 60%), var(--bg);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .brand img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .coming-soon {
            font-size: 1.25rem;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="brand">
        <img src="definitely-icon.png" alt="Definitely app logo">
        <span>Definitely</span>
    </div>
    <div class="coming-soon">Coming Soon</div>
</body>

</html>
