<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Definitely</title>
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="theme-color" content="#f8f3ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://waynevernon.com/definitely/404.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" as="style">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/definitely-icon-dark.png">
    <link rel="apple-touch-icon" href="images/definitely-icon-dark.png">
    <link rel="manifest" href="site.webmanifest">
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/definitely/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
    <script src="js/analytics.js" defer></script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="shell narrow">
        <header>
            <a class="brand" href="index.html" aria-label="Definitely - Home">
                <picture>
                    <source srcset="images/definitely-icon-light.png" media="(prefers-color-scheme: dark)">
                    <img src="images/definitely-icon-dark.png" alt="Definitely app logo" width="56" height="56" decoding="async">
                </picture>
                <span>Definitely</span>
            </a>
        </header>

        <main id="main-content">
            <h1>Page Not Found</h1>
            <p class="lede">The page you're looking for doesn't exist or has been moved.</p>
            <p class="page-text">You can <a href="index.html" class="link">return to the homepage</a> or check out our <a href="privacy.html" class="link">Privacy Policy</a> or <a href="credits.html" class="link">Credits</a>.</p>
        </main>

        <footer class="footer">
            <span>One-time purchase. No subscriptions.</span>
            <div>
                <a href="privacy.html">Privacy</a>
                &nbsp;&bull;&nbsp;
                <a href="credits.html">Credits</a>
                &nbsp;&bull;&nbsp;
                <a class="contact-link" data-email-user="wayne.vernon" data-email-domain="gmail.com"
                    data-email-subject="Contact — Definitely" aria-label="Contact Definitely support">Contact</a>
            </div>
        </footer>
    </div>
    <script>
        (function obfuscateEmail() {
            try {
                const nodes = document.querySelectorAll("[data-email-user][data-email-domain]");
                nodes.forEach(node => {
                    const user = node.getAttribute("data-email-user");
                    const domain = node.getAttribute("data-email-domain");
                    const subject = node.getAttribute("data-email-subject");
                    if (user && domain) {
                        const address = `${user}@${domain}`;
                        const mailto = subject ? `mailto:${address}?subject=${encodeURIComponent(subject)}` : `mailto:${address}`;
                        node.setAttribute("href", mailto);
                        if (!node.textContent.trim()) {
                            node.textContent = "Contact";
                        }
                    }
                });
            } catch (error) {
                console.error("Email obfuscation error:", error);
            }
        })();
    </script>
</body>

</html>
